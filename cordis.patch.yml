- insert:
    - id: local-openai-image
      name: '@local/dsh-openai-image'
      config:
        apiKeyEnv: OPENAI_API_KEY
        defaultModel: gpt-image-2.5-flare
        quality: medium
        size: 1024x1024
        timeoutMs: 300000
        networkMode: auto
        proxyUrl: ''
        proxyUseDefaultCredentials: false
